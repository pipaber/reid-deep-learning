[project]
name = "ReID-Project"
version = "0.1.0"
description = "Person Re-Identification based on Self-Supervised Learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "numba>=0.67.0",
    "numpy>=2.2.0",
    "pandas>=3.0.5",
    "scipy>=1.17.0",
    "torch==2.11.0",
    "torchvision>=0.26.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]

# CUDA 12.6: incluye kernels sm_80 (A100) y funciona con el driver de KHIPU
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ty.environment]
python = ".venv"

[tool.pyright]
extraPaths = [".", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
